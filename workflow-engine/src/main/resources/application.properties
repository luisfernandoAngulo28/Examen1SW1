spring.application.name=workflow-engine
server.port=${SERVER_PORT:8080}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/workflow_sw1}

# JWT
jwt.secret=${JWT_SECRET:sw1-workflow-engine-secret-key-2026}
jwt.expiration=86400000

# ElevenLabs TTS
elevenlabs.api.key=${ELEVENLABS_API_KEY:}

# AI Microservice (Python/FastAPI) — dejar vacío para usar lógica de respaldo local
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ML Service (TensorFlow) — dejar vacío para usar heurísticas de respaldo
ml.service.url=${ML_SERVICE_URL:http://localhost:8001}

# Firebase Cloud Messaging (push notifications for mobile)
# Option A: path to the serviceAccountKey.json file
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials.json}
# Option B: full JSON content (useful for cloud deployments)
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}

# AWS S3 — document storage (Mejora 1)
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Max file upload size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:4200

# Logging
logging.level.org.springframework.security=DEBUG
