services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservicio Python/FastAPI — Inteligencia Artificial ──────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ['CMD', 'python', '-c',
             'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Microservicio Python — Machine Learning / TensorFlow (Mejora 5) ───────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8001:8001'
    healthcheck:
      test: ['CMD', 'python', '-c',
             'import urllib.request; urllib.request.urlopen("http://localhost:8001/health")']
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Spring Boot — Motor de Workflow (núcleo central) ────────────────────────
  backend:
    build:
      context: ./workflow-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      MONGODB_URI: mongodb://mongodb:27017/workflow_sw1
      JWT_SECRET: ${JWT_SECRET:-sw1-workflow-engine-secret-key-2026}
      SERVER_PORT: 8080
      AI_SERVICE_URL: http://ai-service:8000
      ML_SERVICE_URL: http://ml-service:8001
      # Firebase push notifications — paste full JSON content here or set via .env
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      # Extra CORS origins for production (e.g. http://1.2.3.4 or https://mydomain.com)
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # ── Angular + Nginx — Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-ng
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '4200:80'
    depends_on:
      - backend

volumes:
  mongodata:
