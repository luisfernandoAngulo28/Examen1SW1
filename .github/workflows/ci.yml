name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Spring Boot + Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workflow-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: ./mvnw test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/workflow_test
          JWT_SECRET: test-secret-ci

      - name: Build JAR (skip tests)
        run: ./mvnw package -DskipTests -B

  frontend-build:
    name: Frontend Build (Angular 18)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-ng

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-ng/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Build (production)
        run: npx @angular/cli build --configuration=production
        env:
          NG_CLI_ANALYTICS: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t workflow-backend ./workflow-engine

      - name: Build frontend image
        run: docker build -t workflow-frontend ./frontend-ng
