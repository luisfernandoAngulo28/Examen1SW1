global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'flowgov-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 10s

  - job_name: 'flowgov-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']
    scrape_interval: 30s

  - job_name: 'flowgov-ml-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-service:8001']
    scrape_interval: 30s
